# The host-side Controller uses its Karmada kubeconfig (admin in this PoC).
# Runner Pods need an identity, but no Kubernetes API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karmada-runner-gha-rs-no-permission
  namespace: arc-runners
---
# Listener uses this Karmada identity through the mounted karmada-token Secret,
# NOT its member-cluster ServiceAccount. Mirror ARC 0.15.0 rulesForListenerRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: karmada-listener-sa
  namespace: arc-systems
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: karmada-listener
  namespace: arc-runners
rules:
- apiGroups: ["actions.github.com"]
  resources: ["ephemeralrunnersets"]
  resourceNames: ["karmada-runner"]
  verbs: ["patch"]
- apiGroups: ["actions.github.com"]
  resources: ["ephemeralrunners"]
  verbs: ["get", "patch"]
- apiGroups: ["actions.github.com"]
  resources: ["ephemeralrunners/status"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: karmada-listener
  namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: karmada-listener
subjects:
- kind: ServiceAccount
  name: karmada-listener-sa
  namespace: arc-systems
