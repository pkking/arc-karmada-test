# ==============================================================================
# 核心分发策略 (PropagationPolicies)
# ==============================================================================

# 1. 基础资源分发：GitHub Secret 与无权限 Runner ServiceAccount
# Runner Pod 使用的 ServiceAccount 必须存在于每个执行集群。
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-secret-propagation
  namespace: arc-runners
spec:
  # 仅对下列两个显式命名资源接管已有副本（旧 PoC 手工创建过 Runner SA）。
  conflictResolution: Overwrite
  resourceSelectors:
  - apiVersion: v1
    kind: Secret
    name: arc-github-secret
  - apiVersion: v1
    kind: ServiceAccount
    name: karmada-runner-gha-rs-no-permission
  placement:
    clusterAffinity:
      clusterNames:
      - member1
      - member2
---
# 2. 单一 Listener 及其依赖凭证定向分发策略
# 将 Listener Pod 及所需的跨集群认证 Secret、ServiceAccount 调度到指定集群 (如 member1)
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-listener-propagation
  namespace: arc-systems
spec:
  # 自动追踪 Pod 引用的 config Secret 和 karmada-token，避免绑定版本相关名称。
  propagateDeps: true
  resourceSelectors:
  - apiVersion: v1
    kind: Pod
    labelSelector:
      matchLabels:
        actions.github.com/scale-set-name: karmada-runner
        actions.github.com/scale-set-namespace: arc-runners
  - apiVersion: v1
    kind: Secret
    name: karmada-token
  - apiVersion: v1
    kind: ServiceAccount
    labelSelector:
      matchLabels:
        actions.github.com/scale-set-name: karmada-runner
        actions.github.com/scale-set-namespace: arc-runners
  placement:
    clusterAffinity:
      clusterNames:
      - member1
---
# 3. 核心机制 ③：Runner Pod 跨集群分摊调度与 JIT Secret 依赖自动穿透策略
# - propagateDeps: true: Karmada 自动解析 Runner Pod 环境变量中通过 secretKeyRef
#   引用的瞬时一次性 JIT 凭据 Secret，并按 Pod 的 placement 下发依赖（非原子事务）；
# - replicaScheduling: Divided / Weighted: 对每个 Pod 单独调度，不保证多个独立 Pod 均匀分布。
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-runner-pod-propagation
  namespace: arc-runners
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Pod
  propagateDeps: true
  placement:
    clusterAffinity:
      clusterNames:
      - member1
      - member2
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Weighted
