<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1060" width="1600" height="1060" role="img" aria-labelledby="useCaseTitle useCaseDesc"><title id="useCaseTitle">昇腾CI 联邦集群功能域概要用例视图</title><desc id="useCaseDesc">CI开发者、平台管理员、资源池管理员、安全管理员与平台运维和联邦集群功能域九个主要业务用例之间的关系。白底黑字、灰色边界、淡红色强调主要用例。</desc><rect width="1600" height="1060" fill="#fff"/><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif}</style><text x="800" y="70" font-size="39" font-weight="750" fill="#20262d" text-anchor="middle">昇腾CI 联邦集群功能域概要用例视图</text><text x="800" y="104" font-size="21" font-weight="400" fill="#65707c" text-anchor="middle">业务角色与主要用例关系（非处理流程）</text><rect x="237" y="157" width="1124" height="820" rx="9" fill="#fff" stroke="#818d98" stroke-width="2.3"/><text x="267" y="196" font-size="25" font-weight="700" fill="#222932" text-anchor="start">昇腾CI 联邦集群功能域</text><rect x="268" y="232" width="1062" height="216" rx="8" fill="#fff" stroke="#c9d3de" stroke-width="1.6" stroke-dasharray="8 6"/><text x="295" y="265" font-size="23" font-weight="700" fill="#27303a" text-anchor="start">任务接入与使用</text><text x="295" y="296" font-size="18" font-weight="400" fill="#5c6874" text-anchor="start">面向 CI 开发者，提供统一 Runner 服务入口和执行反馈</text><rect x="268" y="465" width="1062" height="245" rx="8" fill="#fff" stroke="#c9d3de" stroke-width="1.6" stroke-dasharray="8 6"/><text x="295" y="498" font-size="23" font-weight="700" fill="#27303a" text-anchor="start">资源与调度管理</text><text x="295" y="529" font-size="18" font-weight="400" fill="#5c6874" text-anchor="start">面向平台管理员与资源池管理员，统一配置服务、成员与策略</text><rect x="268" y="729" width="1062" height="217" rx="8" fill="#fff" stroke="#c9d3de" stroke-width="1.6" stroke-dasharray="8 6"/><text x="295" y="762" font-size="23" font-weight="700" fill="#27303a" text-anchor="start">安全与运维</text><text x="295" y="793" font-size="18" font-weight="400" fill="#5c6874" text-anchor="start">提供访问控制、运行状态可视化与故障诊断</text><g><rect x="296" y="333" width="308" height="99" rx="7" fill="#ffe3e7" stroke="#e44963" stroke-width="2.2"/><text x="450" y="367" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">提交 CI 任务</text><text x="450" y="399" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">提交构建、测试和发布工作流</text></g><g><rect x="645" y="333" width="308" height="99" rx="7" fill="#fff" stroke="#8995a2" stroke-width="1.65"/><text x="799" y="367" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">选择统一 Runner 服务</text><text x="799" y="399" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">按服务标签选择合适的 Runner</text></g><g><rect x="994" y="333" width="308" height="99" rx="7" fill="#fff" stroke="#8995a2" stroke-width="1.65"/><text x="1148" y="367" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">获取任务执行结果</text><text x="1148" y="399" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">查看执行状态、日志与结果</text></g><g><rect x="296" y="574" width="308" height="111" rx="7" fill="#ffe3e7" stroke="#e44963" stroke-width="2.2"/><text x="450" y="608" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">配置统一 Runner 服务</text><text x="450" y="640" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">定义服务规格、镜像与容量策略</text></g><g><rect x="645" y="574" width="308" height="111" rx="7" fill="#fff" stroke="#8995a2" stroke-width="1.65"/><text x="799" y="608" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">纳管成员集群与 NPU 资源</text><text x="799" y="640" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">接入成员集群，维护资源池</text></g><g><rect x="994" y="574" width="308" height="111" rx="7" fill="#fff" stroke="#8995a2" stroke-width="1.65"/><text x="1148" y="608" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">配置联邦调度策略</text><text x="1148" y="640" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">定义可调度成员和资源约束</text></g><g><rect x="296" y="816" width="308" height="108" rx="7" fill="#ffe3e7" stroke="#e44963" stroke-width="2.2"/><text x="450" y="850" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">管理跨控制面身份与权限</text><text x="450" y="882" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">配置身份、RBAC 和凭证轮换</text></g><g><rect x="645" y="816" width="308" height="108" rx="7" fill="#fff" stroke="#8995a2" stroke-width="1.65"/><text x="799" y="850" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">查看任务状态与执行位置</text><text x="799" y="882" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">查询 Job、Runner 与成员状态</text></g><g><rect x="994" y="816" width="308" height="108" rx="7" fill="#fff" stroke="#8995a2" stroke-width="1.65"/><text x="1148" y="850" font-size="21" font-weight="700" fill="#232930" text-anchor="middle">诊断故障与审计事件</text><text x="1148" y="882" font-size="17" font-weight="400" fill="#485463" text-anchor="middle">定位异常，查看操作与审计记录</text></g><g><rect x="20" y="320" width="195" height="121" rx="6" fill="#fff" stroke="#929ca7" stroke-width="1.7"/><text x="117.5" y="353" font-size="24" font-weight="700" fill="#232930" text-anchor="middle">CI 开发者</text><text x="117.5" y="384" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">提交与使用 CI 任务</text><text x="117.5" y="409" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">获取任务执行结果</text></g><g><rect x="1385" y="481" width="195" height="127" rx="6" fill="#fff" stroke="#929ca7" stroke-width="1.7"/><text x="1482.5" y="514" font-size="24" font-weight="700" fill="#232930" text-anchor="middle">平台管理员</text><text x="1482.5" y="545" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">配置 Runner 服务</text><text x="1482.5" y="570" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">维护联邦调度策略</text></g><g><rect x="1385" y="628" width="195" height="127" rx="6" fill="#fff" stroke="#929ca7" stroke-width="1.7"/><text x="1482.5" y="661" font-size="24" font-weight="700" fill="#232930" text-anchor="middle">资源池管理员</text><text x="1482.5" y="692" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">管理成员集群</text><text x="1482.5" y="717" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">维护 NPU 资源</text></g><g><rect x="1385" y="814" width="195" height="127" rx="6" fill="#fff" stroke="#929ca7" stroke-width="1.7"/><text x="1482.5" y="847" font-size="24" font-weight="700" fill="#232930" text-anchor="middle">安全管理员</text><text x="1482.5" y="878" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">管理身份与权限</text><text x="1482.5" y="903" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">维护凭证策略</text></g><g><rect x="20" y="815" width="195" height="127" rx="6" fill="#fff" stroke="#929ca7" stroke-width="1.7"/><text x="117.5" y="848" font-size="24" font-weight="700" fill="#232930" text-anchor="middle">平台运维</text><text x="117.5" y="879" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">查看系统运行状态</text><text x="117.5" y="904" font-size="17" font-weight="400" fill="#4f5c68" text-anchor="middle">排查和处理故障</text></g><path d="M215 380 H296" fill="none" stroke="#737f89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 401 H243 V448 H1132 V432" fill="none" stroke="#737f89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1385 519 H1357 V546 H450 V574" fill="none" stroke="#737f89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1385 563 H1337 V638 H1302" fill="none" stroke="#737f89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1385 681 H1347 V704 H806 V685" fill="none" stroke="#737f89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1385 878 H1352 V870 H1302 V870 H1302" fill="none" stroke="#737f89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1385 902 H1360 V949 H450 V924" fill="none