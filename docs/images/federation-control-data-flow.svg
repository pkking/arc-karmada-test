" y="309" class="label" text-anchor="middle">Resource</text><text x="725" y="333" class="label" text-anchor="middle">Binding</text><line x1="790" y1="317" x2="810" y2="317" fill="none" stroke="#2c79c9" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="810" y="280" width="130" height="75" rx="9" fill="#fff" stroke="#acc8e8" stroke-width="1.5"/><text x="875" y="309" class="label" text-anchor="middle">arc-fedsched</text><text x="875" y="333" class="label" text-anchor="middle">Dispatcher</text><line x1="940" y1="317" x2="960" y2="317" fill="none" stroke="#2c79c9" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="960" y="280" width="130" height="75" rx="9" fill="#fff" stroke="#acc8e8" stroke-width="1.5"/><text x="1025" y="309" class="label" text-anchor="middle">Karmada</text><text x="1025" y="333" class="label" text-anchor="middle">Binding / Work</text><line x1="1090" y1="317" x2="1110" y2="317" fill="none" stroke="#2c79c9" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="1110" y="280" width="130" height="75" rx="9" fill="#fff" stroke="#acc8e8" stroke-width="1.5"/><text x="1175" y="309" class="label" text-anchor="middle">Runner</text><text x="1175" y="333" class="label" text-anchor="middle">Pod</text><line x1="1240" y1="317" x2="1260" y2="317" fill="none" stroke="#2c79c9" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="1260" y="280" width="130" height="75" rx="9" fill="#fff" stroke="#acc8e8" stroke-width="1.5"/><text x="1325" y="309" class="label" text-anchor="middle">Hooks /</text><text x="1325" y="333" class="label" text-anchor="middle">Workflow Pod</text><line x1="1390" y1="317" x2="1410" y2="317" fill="none" stroke="#2c79c9" stroke-width="2.7"  marker-end="url(#arrow)"/><rect x="1410" y="280" width="130" height="75" rx="9" fill="#e4f5e8" stroke="#71bb97" stroke-width="1.5"/><text x="1475" y="309" class="label" text-anchor="middle">NPU Node</text><text x="1475" y="333" class="label" text-anchor="middle">执行资源</text><rect x="47" y="422" width="110