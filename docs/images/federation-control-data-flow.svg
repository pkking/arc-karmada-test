c9ea" stroke-width="1.5"/><text x="1019" y="525" class="h" text-anchor="middle">Holder</text><text x="1019" y="552" class="small" text-anchor="middle">条件写入 RB</text><text x="1019" y="572" class="small" text-anchor="middle">grant 更新</text><rect x="925" y="619" width="190" height="72" rx="10" fill="#fff" stroke="#adc9ea" stroke-width="1.5"/><text x="1020" y="654" class="h" text-anchor="middle">Actuator</text><text x="1020" y="681" class="small" text-anchor="middle">节点预留</text><rect x="1182" y="423" width="354" height="282" rx="12" fill="#fff" stroke="#b6d1ec" stroke-width="1.5"/><text x="1210" y="457" class="section" text-anchor="start">可靠性与运营能力</text><rect x="1200" y="478" width="320" height="65" rx="10" fill="#fff" stroke="#adc9ea" stroke-width="1.5"/><text x="1360" y="513" class="h" text-anchor="middle">Watchdog / Break-glass</text><rect x="1200" y="553" width="155" height="65" rx="10" fill="#fff" stroke="#adc9ea" stroke-width="1.5"/><text x="1277.5" y="588" class="h" text-anchor="middle">Janitor</text><text x="1277.5" y="615" class="small" text-anchor="middle">预留回收</text><rect x="1365" y="553" width="155" height="65" rx="10" fill="#fff" stroke="#adc9ea" stroke-width="1.5"/><text x="1442.5" y="588" class="h" text-anchor="middle">Reaper</text><text x="1442.5" y="615" class="small" text-anchor="middle">Pod 回收</text><rect x="1200" y="628" width="320" height="62" rx="10" fill="#fff" stroke="#adc9ea" stroke-width="1.5"/><text x="1360" y="663" class="h" text-anchor="middle">Metrics / Timeline / Trace</text><polyline points="1460,393 1460,414 163,414 163,490" fill="none" stroke="#5687bf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#darrow)"/><text x="830" y="408" class="tiny" text-anchor="middle">状态回流：Node / Pod / Runner</text><polyline points="805,490 805,455 865,455 865,393" fill="none" stroke="#5687bf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#darrow)"/><polyline points="1019,490 1019,468 670,468 670,355" fill="none" stroke="#5687bf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#darrow)"/><polyline points="1019,619 1019,612 1490,612 1490,393" fill="none" stroke="#5687bf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#darrow)"/><polyline points="1042,393 1042,442 1360,442 1360,478" fill="none" stroke="#5687bf" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#darrow)"/><rect x="90" y="834" width="1420" height="46" rx="8" fill="#f2f6fb" stroke="#c6d6e9" stroke-width="1"/><text x="800" y="864" class="small" text-anchor="middle">ResourceBinding 条件释放后，Karmada 分发 Work；成员状态回流至 Ledger；Watchdog、Janitor、Reaper 支撑故障恢复。</text></svg>