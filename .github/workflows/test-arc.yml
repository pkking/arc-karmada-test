name: Test Unified ARC Karmada Multi-Cluster
# Real self-hosted Runner E2E must be explicitly dispatched.
# Documentation/static-contract pushes must not enqueue three CI Jobs.
on:
  workflow_dispatch:

jobs:
  job-1:
    runs-on: karmada-runner
    steps:
      - name: Report Job 1
        run: |
          echo '=========================================='
          echo 'Executing Job 1 on unified karmada-runner!'
          echo 'Hostname: '$(hostname)
          echo 'IP: '$(hostname -I 2>/dev/null || ip a)
          echo 'Date: '$(date)
          echo '=========================================='

  job-2:
    runs-on: karmada-runner
    steps:
      - name: Report Job 2
        run: |
          echo '=========================================='
          echo 'Executing Job 2 on unified karmada-runner!'
          echo 'Hostname: '$(hostname)
          echo 'IP: '$(hostname -I 2>/dev/null || ip a)
          echo 'Date: '$(date)
          echo '=========================================='

  job-3:
    runs-on: karmada-runner
    steps:
      - name: Report Job 3
        run: |
          echo '=========================================='
          echo 'Executing Job 3 on unified karmada-runner!'
          echo 'Hostname: '$(hostname)
          echo 'IP: '$(hostname -I 2>/dev/null || ip a)
          echo 'Date: '$(date)
          echo '=========================================='
