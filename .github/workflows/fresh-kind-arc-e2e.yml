name: Fresh Kind ARC Karmada Real E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-kind-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Kind CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install Karmada v1.19.0 CLI with release checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/karmada-cli
          cd /tmp/karmada-cli
          base=https://github.com/karmada-io/karmada/releases/download/v1.19.0
          curl --retry 3 -fsSLo karmadactl-linux-amd64.tgz "$base/karmadactl-linux-amd64.tgz"
          curl --retry 3 -fsSLo karmadactl-linux-amd64.tgz.sha256 "$base/karmadactl-linux-amd64.tgz.sha256"
          sha256sum -c karmadactl-linux-amd64.tgz.sha256
          tar -xzf karmadactl-linux-amd64.tgz
          bin=$(find . -type f -name karmadactl | head -n 1)
          test -n "$bin"
          sudo install -m 0755 "$bin" /usr/local/bin/karmadactl
          karmadactl version || karmadactl --help >/dev/null

      - name: Create three fresh Kind clusters
        shell: bash
        run: |
          set -euo pipefail
          image="kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
          for cluster in karmada-host member1 member2; do
            kind create cluster --name "$cluster" --image "$image" --wait 180s
          done
          kind get clusters

      - name: Initialize exact Karmada control plane versions
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/karmada-data" "$HOME/karmada-data/pki"
          karmadactl init --kubeconfig="$HOME/.kube/config" --context=kind-karmada-host \
            --karmada-data="$HOME/karmada-data" \
            --karmada-pki="$HOME/karmada-data/pki" \
            --crds=https://github.com/karmada-io/karmada/releases/download/v1.19.0/crds.tar.gz \
            --karmada-aggregated-apiserver-image=docker.io/karmada/karmada-aggregated-apiserver:v1.19.0 \
            --karmada-controller-manager-image=docker.io/karmada/karmada-controller-manager:v1.19.0 \
            --karmada-scheduler-image=docker.io/karmada/karmada-scheduler:v1.19.0 \
            --karmada-webhook-image=docker.io/karmada/karmada-webhook:v1.19.0 \
            --karmada-apiserver-image=registry.k8s.io/kube-apiserver:v1.37.0 \
            --karmada-kube-controller-manager-image=registry.k8s.io/kube-controller-manager:v1.37.0 \
            --kube-image-tag=v1.37.0 \
            --etcd-image=registry.k8s.io/etcd:3.7.0-0 > "$RUNNER_TEMP/karmada-init.log" 2>&1

      - name: Join both members using internal Kind contexts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/karmada-data"
          if test -f "$HOME/.kube/karmada.config"; then
            cp "$HOME/.kube/karmada.config" "$HOME/karmada-data/karmada-apiserver.config"
          fi
          test -s "$HOME/karmada-data/karmada-apiserver.config"
          for member in member1 member2; do
            config="$HOME/karmada-data/$member-internal.config"
            kind get kubeconfig --name "$member" --internal > "$config"
            ip=$(docker inspect -f '{{with index .NetworkSettings.Networks "kind"}}{{.IPAddress}}{{end}}' "$member-control-plane")
            test -n "$ip"
            # The Kind node is reachable from the host and other Kind nodes by
            # its Docker bridge IP; preserve the hostname used in the API cert.
            kubectl --kubeconfig="$config" config set-cluster "kind-$member" \
              --server="https://$ip:6443" --tls-server-name="$member-control-plane"
            kubectl --kubeconfig="$config" get nodes -o name
            karmadactl --kubeconfig="$HOME/karmada-data/karmada-apiserver.config" \
              join "$member" --cluster-kubeconfig="$config" > "$RUNNER_TEMP/karmada-join-$member.log" 2>&1
          done
          for member in member1 member2; do
            kubectl --kubeconfig="$HOME/karmada-data/karmada-apiserver.config" \
              wait --for=condition=Ready "clusters.cluster.karmada.io/$member" --timeout=300s
          done

      - name: Install ARC CRDs and server-dry-run PoC manifests
        shell: bash
        run: |
          set -euo pipefail
          k="$HOME/karmada-data/karmada-apiserver.config"
          kubectl --kubeconfig="$k" apply --server-side -f crds/
          kubectl --kubeconfig="$k" apply -f manifests/00-namespaces.yaml
          kubectl --kubeconfig="$k" apply --dry-run=server -f manifests/01-karmada-interpreter.yaml
          kubectl --kubeconfig="$k" apply --dry-run=server -f manifests/02-propagation-policies.yaml
          kubectl --kubeconfig="$k" apply --dry-run=server -f manifests/03-rbac.yaml
          kubectl --kubeconfig="$k" apply --dry-run=server -f manifests/04-autoscalingrunnerset.yaml
          kubectl --kubeconfig="$k" get clusters.cluster.karmada.io


      - name: Check explicit GitHub runner registration credential
        env:
          ARC_E2E_PAT: ${{ secrets.ARC_E2E_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$ARC_E2E_PAT"; then
            echo "::error::Repository Actions secret ARC_E2E_PAT is missing. Needs permission to manage the target repository self-hosted Runners and dispatch workflows."
            exit 2
          fi

      - name: Configure real ARC credentials and placement
        env:
          ARC_E2E_PAT: ${{ secrets.ARC_E2E_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          k="$HOME/karmada-data/karmada-apiserver.config"
          umask 077
          secret_dir=$(mktemp -d)
          trap 'rm -rf "$secret_dir"' EXIT
          printf '%s' "$ARC_E2E_PAT" > "$secret_dir/github_token"
          kubectl --kubeconfig="$k" -n arc-runners create secret generic arc-github-secret \
            --from-file=github_token="$secret_dir/github_token" \
            --dry-run=client -o yaml | kubectl --kubeconfig="$k" apply -f - >/dev/null
          rm -rf "$secret_dir"
          trap - EXIT
          kubectl --kubeconfig="$k" apply -f manifests/01-karmada-interpreter.yaml
          kubectl --kubeconfig="$k" apply -f manifests/03-rbac.yaml
          KUBECONFIG_KARMADA="$k" bash scripts/setup-karmada-token.sh >/dev/null
          kubectl --kubeconfig="$k" apply -f manifests/02-propagation-policies.yaml
          control_ip=$(docker inspect -f '{{with index .NetworkSettings.Networks "kind"}}{{.IPAddress}}{{end}}' karmada-host-control-plane)
          test -n "$control_ip"
          python3 scripts/render-runner-set.py \
            --control-plane-ip "$control_ip" --api-port 32443 \
            --github-url "https://github.com/$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/autoscalingrunnerset.yaml"
          kubectl --kubeconfig="$k" apply -f "$RUNNER_TEMP/autoscalingrunnerset.yaml"

      - name: Start official ARC Controller and verify real T1 plus directed T2
        env:
          GH_TOKEN: ${{ secrets.ARC_E2E_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          export KUBECONFIG_KARMADA="$HOME/karmada-data/karmada-apiserver.config"
          mkdir -p /tmp/arc-015-validation
          bash scripts/run-arc-controller.sh > "$RUNNER_TEMP/arc-controller.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/arc-controller.pid"
          listener_ready=0
          for attempt in $(seq 1 45); do
            if kubectl --kubeconfig="$KUBECONFIG_KARMADA" -n arc-systems \
              wait --for=condition=Ready pod \
              -l actions.github.com/scale-set-name=karmada-runner --timeout=8s >/dev/null 2>&1; then
              listener_ready=1
              break
            fi
            sleep 5
          done
          test "$listener_ready" -eq 1
          python3 scripts/preflight-poc.py --mode ready \
            --output /tmp/arc-015-validation/ready-preflight.json
          python3 scripts/verify-arc.py --dispatch --coverage-mode report-only --duration 180 \
            --output /tmp/arc-015-validation/t1-functional.json
          for member in member1 member2; do
            kubectl --kubeconfig="$KUBECONFIG_KARMADA" -n arc-runners \
              patch propagationpolicy arc-runner-pod-propagation --type=json \
              -p "[{\"op\":\"replace\",\"path\":\"/spec/placement/clusterAffinity/clusterNames\",\"value\":[\"$member\"]}]" >/dev/null
            python3 scripts/verify-arc.py --dispatch --coverage-mode require --duration 180 \
              --required-contexts "kind-$member" \
              --output "/tmp/arc-015-validation/t2-$member.json"
          done

      - name: Restore original dual-member propagation policy
        if: always()
        shell: bash
        run: |
          if test -s "$HOME/karmada-data/karmada-apiserver.config"; then
            kubectl --kubeconfig="$HOME/karmada-data/karmada-apiserver.config" \
              apply -f manifests/02-propagation-policies.yaml || true
          fi

      - name: Upload sanitized T1 T2 results if any
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-kind-t1-t2-evidence
          path: /tmp/arc-015-validation/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Print explicit validation boundary
        shell: bash
        run: |
          echo 'T1 functional and member1/member2 directed T2 completed if all steps above succeeded.'
          echo 'NPU, HA, token rotation and T3 statistical balance are NOT proven by this E2E.'

      - name: Destroy disposable Kind clusters
        if: always()
        shell: bash
        run: |
          for cluster in member1 member2 karmada-host; do
            kind delete cluster --name "$cluster" || true
          done
